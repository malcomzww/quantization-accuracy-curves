name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The shared libraries are sibling checkouts pinned by tag rather than
      # published packages, so they are fetched next to this repo to reproduce
      # the local directory layout the path dependency expects.
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: quantization-accuracy-curves

      - name: Check out llm-eval-harness alongside it
        uses: actions/checkout@v4
        with:
          repository: malcomzww/llm-eval-harness
          ref: v0.1.0
          path: llm-eval-harness

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: quantization-accuracy-curves
        run: uv sync --extra dev

      - name: Lint
        working-directory: quantization-accuracy-curves
        run: uv run ruff check src tests scripts

      - name: Test
        working-directory: quantization-accuracy-curves
        run: uv run pytest -q

      # Every number in the README is generated, so a hand-edited result fails
      # the build rather than silently drifting from the code behind it.
      - name: Verify generated results are current
        working-directory: quantization-accuracy-curves
        run: |
          if [ -f scripts/generate_results.py ]; then
            uv run python scripts/generate_results.py
            git diff --exit-code results/ \
              || (echo "results/ is stale -- regenerate and commit" && exit 1)
          fi
