name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The shared libraries are sibling checkouts pinned by tag rather than
      # published packages, so they are fetched next to this repo to reproduce
      # the local directory layout the path dependency expects.
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: quantization-accuracy-curves

      - name: Check out llm-eval-harness alongside it
        uses: actions/checkout@v4
        with:
          repository: malcomzww/llm-eval-harness
          ref: v0.1.0
          path: llm-eval-harness

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: quantization-accuracy-curves
        run: uv sync --extra dev

      - name: Lint
        working-directory: quantization-accuracy-curves
        run: uv run ruff check src tests scripts

      - name: Test
        working-directory: quantization-accuracy-curves
        run: uv run pytest -q

      # The committed results here depend on a model download and on the
      # host's own hardware, so a runner cannot reproduce the values and
      # diffing them would fail the build for a reason the author cannot fix.
      # What CI can still check is that the generator RUNS -- which catches a
      # broken script, the failure the gate actually exists to catch.
      - name: Results generator still runs
        working-directory: quantization-accuracy-curves
        run: |
          if [ -f scripts/generate_results.py ]; then
            uv run python scripts/generate_results.py ||               (echo "generate_results.py failed to run" && exit 1)
            git diff --stat results/ || true
          fi
