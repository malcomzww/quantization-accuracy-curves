[project]
name = "quantization-accuracy-curves"
version = "0.1.0"
description = "AWQ/GPTQ/INT4/FP8 and KV-cache quantization on one model, with the accuracy degradation curve measured on a real eval."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
