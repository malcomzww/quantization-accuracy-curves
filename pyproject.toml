[project]
name = "quantization-accuracy-curves"
version = "0.1.0"
description = "Real llama.cpp k-quant levels on one model, measuring how much the calibration corpus moves the accuracy degradation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# The measurement stack. Kept optional so that `uv sync --extra dev` gives a
# fast, importable test run: the arithmetic tests need only numpy and the ggml
# library, while running the full sweep needs torch and a model download.
measure = [
    "llama-cpp-python>=0.3",
    "gguf>=0.10",
    "torch>=2.2",
    "transformers>=4.40",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
